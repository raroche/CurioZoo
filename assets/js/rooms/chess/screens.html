<!--
  The Chess Club room's screens.

  Not a page of its own: the app fetches this file the first time a child
  opens the room and adds these sections to <main> in index.html. Until then
  none of it is downloaded. See assets/js/rooms/registry.js.

  The rules are the ones index.html has always had: no style="..." attributes
  (the Content-Security-Policy drops them; use data-style), and every screen
  is a <section class="gp-screen" id="screen-NAME">.
-->
<!-- ============================================================ -->
<!-- Chess Club: three levels, from the pieces to 600+.             -->
<!-- Built in steps; see docs/research/chess/PLAN.md.               -->
<!-- ============================================================ -->
<section class="gp-screen cz-room--leaf" id="screen-chess" aria-labelledby="chess-title">
  <div class="gp-container">
    <div class="gp-backslot"></div>
    <div class="cz-roomhead cz-tile--leaf">
      <span class="cz-roomhead__pic" id="cz-chess-pic" data-room-pic="chess" aria-hidden="true"></span>
      <div>
        <h1 class="gp-page-title" id="chess-title">Chess Club</h1>
        <p class="gp-page-lede">Meet the six pieces one at a time, play a real game, then learn the tricks. Nothing here needs reading out loud.</p>
      </div>
    </div>
    <div id="gp-chess-body"></div>
  </div>
</section>

</section>
